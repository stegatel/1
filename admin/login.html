<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід в адмін-панель - TechAccessory</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --white: #ffffff; --border: #e2e8f0; --radius: 8px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--dark) 0%, #1e293b 100%); }
        .login-box { background: var(--white); padding: 40px; border-radius: var(--radius); width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.2); }
        .text-center { text-align: center; }
        h2 { margin: 15px 0 25px; color: var(--dark); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #475569; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-link { background: none; color: var(--primary); margin-top: 15px; text-decoration: none; font-size: 0.9rem; }
        .logo-icon { font-size: 3rem; color: var(--primary); margin-bottom: 10px; }
        .error-msg { color: #ef4444; font-size: 0.9rem; margin-top: 5px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="text-center">
            <i class="fas fa-cogs logo-icon"></i>
            <h2>CRM Панель</h2>
        </div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Логін</label>
                <input type="text" id="username" value="admin" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" value="admin" required>
                <div class="error-msg" id="error-msg">Невірний логін або пароль</div>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Увійти</button>
            <div class="text-center"><a href="../index.html" class="btn btn-link">← Повернутися в магазин</a></div>
        </form>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === 'admin' && p === 'admin') {
                localStorage.setItem('ta_admin_auth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
                setTimeout(() => document.getElementById('error-msg').style.display = 'none', 3000);
            }
        }
        if(localStorage.getItem('ta_admin_auth') === 'true') window.location.href = 'dashboard.html';
    </script>
</body>
</html>
