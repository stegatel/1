<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід в адмін-панель | TechAccessory</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <i class="fas fa-mobile-alt"></i> TechAccessory
            </div>
            <h2>Вхід в адмін-панель</h2>
            <form id="loginForm" onsubmit="login(event)">
                <div class="form-group">
                    <label>Логін</label>
                    <input type="text" id="username" required placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" required placeholder="admin123">
                </div>
                <button type="submit" class="btn-primary">Увійти</button>
                <p class="login-hint">Логін: admin | Пароль: admin123</p>
            </form>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
